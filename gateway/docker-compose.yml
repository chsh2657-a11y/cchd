version: "3.9"

services:
  moneyprinterturbo:
    # 공식 이미지가 없다면 아래 build 항목으로 원본 저장소를 직접 클론해 빌드하세요.
    # build:
    #   context: https://github.com/harry0703/MoneyPrinterTurbo.git
    image: ghcr.io/harry0703/moneyprinterturbo:latest
    env_file: .env
    ports:
      - "8080:8080"
    restart: unless-stopped

  gateway:
    build: .
    env_file: .env
    depends_on:
      - moneyprinterturbo
    ports:
      - "9000:9000"
    command: uvicorn app:app --host 0.0.0.0 --port 9000
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - moneyprinterturbo
      - gateway
    restart: unless-stopped
