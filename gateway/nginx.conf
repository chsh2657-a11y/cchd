# 하나의 도메인/포트(80번)에서 요청 경로에 따라 각 서비스로 라우팅합니다.
# 실제 배포 시 server_name을 원하는 도메인으로 바꾸세요.

server {
    listen 80;
    server_name _;

    # 통합 게이트웨이 API - /api/ 로 들어오는 요청은 gateway 컨테이너로 전달
    location /api/ {
        proxy_pass http://gateway:9000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MoneyPrinterTurbo 웹UI/자체 API - 나머지 요청은 moneyprinterturbo 컨테이너로 전달
    location / {
        proxy_pass http://moneyprinterturbo:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
